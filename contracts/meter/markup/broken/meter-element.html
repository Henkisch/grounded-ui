<!-- Breaks meter/meter-element: a div with ARIA instead of <meter>. It is named, has the role and a described value, so every outcome rule passes. -->
<div data-gui="meter">
  <label data-gui-part="label" id="storage-label" for="storage">Storage used</label>
  <div data-gui-part="control" id="storage" role="meter" value="1.2" aria-valuenow="1.2" aria-valuemin="0" aria-valuemax="5" aria-labelledby="storage-label" aria-describedby="storage-value"></div>
  <span data-gui-part="value" id="storage-value">1.2 of 5 GB</span>
</div>
