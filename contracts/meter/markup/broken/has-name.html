<!-- Breaks meter/has-name: no label, so the meter is announced as just a number. -->
<div data-gui="meter">
  <meter data-gui-part="control" id="storage" min="0" max="5" low="3" high="4.5" optimum="1" value="1.2" aria-describedby="storage-value">1.2 GB</meter>
  <span data-gui-part="value" id="storage-value">1.2 of 5 GB</span>
</div>
