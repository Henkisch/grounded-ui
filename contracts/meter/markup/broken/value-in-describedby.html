<!-- Breaks meter/value-in-describedby: the value text reaches the meter through aria-description instead of an id reference. -->
<div data-gui="meter">
  <label data-gui-part="label" for="storage">Storage used</label>
  <meter data-gui-part="control" id="storage" min="0" max="5" low="3" high="4.5" optimum="1" value="1.2" aria-description="1.2 of 5 GB">1.2 GB</meter>
  <span data-gui-part="value" id="storage-value">1.2 of 5 GB</span>
</div>
