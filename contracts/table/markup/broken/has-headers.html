<!-- Breaks table/has-headers: every cell is a td, so no value has a header. -->
<section data-gui="table" aria-labelledby="hours-caption" tabindex="0">
  <table data-gui-part="table">
    <caption data-gui-part="caption" id="hours-caption">Recycling centre opening hours</caption>
    <thead>
      <tr><td>Day</td><td>Opens</td><td>Closes</td></tr>
    </thead>
    <tbody>
      <tr><td>Monday to Friday</td><td>07:00</td><td>19:00</td></tr>
      <tr><td>Saturday</td><td>09:00</td><td>15:00</td></tr>
      <tr><td>Sunday</td><td>10:00</td><td>15:00</td></tr>
    </tbody>
  </table>
</section>
