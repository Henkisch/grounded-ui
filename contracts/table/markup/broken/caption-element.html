<!-- Breaks table/caption-element: a heading outside the table names it instead of a caption. -->
<h2 id="hours-heading">Recycling centre opening hours</h2>
<section data-gui="table" aria-labelledby="hours-heading" tabindex="0">
  <table data-gui-part="table" aria-labelledby="hours-heading">
    <thead>
      <tr><th scope="col">Day</th><th scope="col">Opens</th><th scope="col">Closes</th></tr>
    </thead>
    <tbody>
      <tr><td>Monday to Friday</td><td>07:00</td><td>19:00</td></tr>
      <tr><td>Saturday</td><td>09:00</td><td>15:00</td></tr>
      <tr><td>Sunday</td><td>10:00</td><td>15:00</td></tr>
    </tbody>
  </table>
</section>
