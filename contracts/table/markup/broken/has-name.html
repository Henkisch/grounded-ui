<!-- Breaks table/has-name: no caption, so the table has no name (the region keeps an aria-label). also: caption-element -->
<section data-gui="table" aria-label="Opening hours" tabindex="0">
  <table data-gui-part="table">
    <thead>
      <tr><th scope="col">Day</th><th scope="col">Opens</th><th scope="col">Closes</th></tr>
    </thead>
    <tbody>
      <tr><td>Monday to Friday</td><td>07:00</td><td>19:00</td></tr>
      <tr><td>Saturday</td><td>09:00</td><td>15:00</td></tr>
      <tr><td>Sunday</td><td>10:00</td><td>15:00</td></tr>
    </tbody>
  </table>
</section>
