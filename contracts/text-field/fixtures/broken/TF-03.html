<!-- Breaks TF-03: a scripted div role="textbox" instead of a native input. It is named and has the right role, so every outcome rule passes. -->
<div data-component="text-field">
  <label data-part="label" id="city-label" for="city">City</label>
  <div data-part="control" id="city" name="city" role="textbox" contenteditable="true" aria-labelledby="city-label"></div>
</div>
