<!-- Breaks TF-09: the description is repeated in aria-description instead of being referenced by id. Screen readers still get it. -->
<div data-component="text-field">
  <label data-part="label" for="vat">VAT number</label>
  <p data-part="description" id="vat-desc">Country code followed by the number.</p>
  <input data-part="control" type="text" id="vat" name="vat" aria-description="Country code followed by the number.">
</div>
