<!-- Breaks TF-20: the error is shown but never reaches the control's name or description. also: TF-11 -->
<div data-gui="text-field">
  <label data-gui-part="label" for="email">Email</label>
  <input data-gui-part="control" type="email" id="email" name="email" aria-invalid="true">
  <p data-gui-part="error" id="email-error">Enter a valid email address, for example name@example.com</p>
</div>
