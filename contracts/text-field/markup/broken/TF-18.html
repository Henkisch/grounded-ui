<!-- Breaks TF-18: aria-labelledby names the control "Postal town", so the visible label "City" is not in its name. -->
<div data-gui="text-field">
  <label data-gui-part="label" for="city">City</label>
  <span id="city-name" hidden>Postal town</span>
  <input data-gui-part="control" type="text" id="city" name="city" aria-labelledby="city-name">
</div>
