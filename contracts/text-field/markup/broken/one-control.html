<!-- Breaks text-field/one-control: two controls share one label. also: text-field/has-name -->
<div data-gui="text-field">
  <label data-gui-part="label" for="phone">Phone</label>
  <input data-gui-part="control" type="tel" id="phone" name="phone">
  <input data-gui-part="control" type="tel" id="phone-2" name="phone-2">
</div>
