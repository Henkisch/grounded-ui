<!-- Breaks TF-03: a scripted div role="textbox" instead of a native input. It is named and has the right role, so every outcome rule passes. -->
<div data-gui="text-field">
  <label data-gui-part="label" id="city-label" for="city">City</label>
  <div data-gui-part="control" id="city" name="city" role="textbox" contenteditable="true" aria-labelledby="city-label"></div>
</div>
