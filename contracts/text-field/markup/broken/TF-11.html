<!-- Breaks TF-11: the description id comes before the error id. -->
<div data-gui="text-field">
  <label data-gui-part="label" for="email">Email</label>
  <p data-gui-part="description" id="email-desc">We only use it for the confirmation.</p>
  <input data-gui-part="control" type="email" id="email" name="email" aria-invalid="true" aria-describedby="email-desc email-error">
  <p data-gui-part="error" id="email-error">Enter a valid email address, for example name@example.com</p>
</div>
