<!-- :autofill can't be triggered in static HTML. The field carries the right autocomplete so the browser fills it in. -->
<div data-gui="text-field">
  <label data-gui-part="label" for="given-name">First name</label>
  <input data-gui-part="control" type="text" id="given-name" name="given-name" autocomplete="given-name">
</div>
