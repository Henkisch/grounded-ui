<!-- Breaks dialog/title-has-text: the title is empty. also: dialog/has-name -->
<button type="button" commandfor="d" command="show-modal">Open</button>
<dialog data-gui="dialog" id="d" aria-labelledby="d-title">
  <h2 data-gui-part="title" id="d-title"></h2>
  <div data-gui-part="actions"><button type="button" commandfor="d" command="close">Close</button></div>
</dialog>
