<!-- Breaks DG-16: no button at all, so pointer and touch users have no visible way to act or leave. also: DG-09 -->
<button type="button" commandfor="d" command="show-modal">Open</button>
<dialog data-gui="dialog" id="d" aria-labelledby="d-title">
  <h2 data-gui-part="title" id="d-title">Settings</h2>
  <p data-gui-part="body">Press Esc to close.</p>
</dialog>
