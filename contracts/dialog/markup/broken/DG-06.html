<!-- Breaks DG-06: aria-labelledby points at the body, not the title. also: DG-15 -->
<button type="button" commandfor="d" command="show-modal">Open</button>
<dialog data-gui="dialog" id="d" aria-labelledby="d-body">
  <h2 data-gui-part="title" id="d-title">Settings</h2>
  <p data-gui-part="body" id="d-body">Choose what to share.</p>
  <div data-gui-part="actions"><button type="button" commandfor="d" command="close">Close</button></div>
</dialog>
