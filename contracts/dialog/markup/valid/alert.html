<button data-gui="button" type="button" commandfor="delete-draft" command="show-modal" data-gui-variant="danger">Delete draft</button>

<dialog data-gui="dialog" data-gui-variant="alert" role="alertdialog" id="delete-draft" aria-labelledby="delete-draft-title" aria-describedby="delete-draft-desc">
  <h2 data-gui-part="title" id="delete-draft-title">Delete this draft?</h2>
  <p data-gui-part="body" id="delete-draft-desc">The draft and its attachments are removed permanently. This cannot be undone.</p>
  <div data-gui-part="actions">
    <button data-gui="button" type="button" commandfor="delete-draft" command="close" autofocus data-gui-variant="secondary">Cancel</button>
    <button data-gui="button" type="button" commandfor="delete-draft" command="close" data-gui-variant="danger">Delete</button>
  </div>
</dialog>
