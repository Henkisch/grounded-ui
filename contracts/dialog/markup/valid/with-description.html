<button type="button" commandfor="cookies" command="show-modal">Cookie settings</button>

<dialog data-gui="dialog" id="cookies" aria-labelledby="cookies-title" aria-describedby="cookies-desc">
  <h2 data-gui-part="title" id="cookies-title">Cookie settings</h2>
  <p data-gui-part="body" id="cookies-desc">We use cookies to measure how the site is used. Nothing is shared with third parties.</p>
  <div data-gui-part="actions">
    <button type="button" commandfor="cookies" command="close">Only necessary</button>
    <button type="button" commandfor="cookies" command="close">Accept all</button>
  </div>
</dialog>
