<!-- Breaks DG-11: overrides the role with something other than alertdialog. -->
<button type="button" commandfor="d" command="show-modal">Open</button>
<dialog data-component="dialog" id="d" aria-labelledby="d-title" role="region">
  <h2 data-part="title" id="d-title">Settings</h2>
  <div data-part="actions"><button type="button" commandfor="d" command="close">Close</button></div>
</dialog>
