<button type="button" commandfor="newsletter" command="show-modal">Subscribe</button>

<dialog data-component="dialog" id="newsletter" aria-labelledby="newsletter-title" closedby="any">
  <h2 data-part="title" id="newsletter-title">Subscribe to the newsletter</h2>
  <p data-part="body">One email a month with news from the municipality. Unsubscribe any time.</p>
  <div data-part="actions">
    <button type="button" commandfor="newsletter" command="close">Close</button>
  </div>
</dialog>
