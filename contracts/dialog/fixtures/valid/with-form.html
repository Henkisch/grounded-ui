<button type="button" commandfor="callback" command="show-modal">Request a callback</button>

<dialog data-component="dialog" id="callback" aria-labelledby="callback-title">
  <h2 data-part="title" id="callback-title">Request a callback</h2>
  <form data-part="body" method="dialog">
    <div data-component="text-field">
      <label data-part="label" for="callback-phone">Phone number</label>
      <input data-part="control" type="tel" id="callback-phone" name="phone" autocomplete="tel">
    </div>
    <div data-part="actions">
      <button type="button" commandfor="callback" command="close">Cancel</button>
      <button type="submit">Send</button>
    </div>
  </form>
</dialog>
