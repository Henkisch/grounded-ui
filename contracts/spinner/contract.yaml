# Contract: spinner
# A loading indicator: a status region with text ("Loading…") and an animated graphic nobody hears.
# The single source for the conformance tests, warning CSS, editor validation and the docs page.
# Test selectors name parts ({graphic}, {label}); `:scope` is the root (the status region itself).
# Reduced motion is a technique, not a rule: the reference CSS swaps the rotation for a slow pulse under
# prefers-reduced-motion, which a static check can't observe without emulating the setting.
component: spinner
contractVersion: 0.1.0
title: Spinner
summary: A loading indicator with text, in a status region, so screen readers hear "Loading" and nobody depends on the animation. Zero JavaScript.

budget:
  css: 1536
  js: 0

# Browser features the reference implementation relies on, by web-features id.
requires:
  - feature: scope
  - feature: animations-css
  - feature: prefers-reduced-motion

anatomy:
  root:
    label: Root
    element: [div, span]
    required: true
  graphic:
    label: Graphic
    element: [span, svg]
  label:
    label: Text
    element: [span]
    required: true

domOrder: [graphic, label]

variants:
  - name: quiet
    description: The text is visually hidden; only the graphic shows. Screen readers still hear the text.
  - name: large
    description: A bigger graphic for a whole panel or page that is loading.

states:
  - { name: loading, label: Loading, dom: in the page, hook: ":scope" }
  - { name: reduced-motion, label: Reduced motion, hook: "@media (prefers-reduced-motion: reduce)" }

keyboard:
  - { key: None, behavior: "The spinner never takes focus; its text is announced where the user already is." }

# level: normative = a standard requires it (source says which); recommended = our judgement, open to review.
# type: outcome = what any implementation must achieve, judged on the rendered result (computed name, role,
#       description, visible text); outside implementations are judged on these.
#       technique = how Grounded UI's reference markup achieves it; always recommended, never a verdict on other markup.
rules:
  - id: spinner/role
    description: The spinner has the role status.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/status-messages
    rationale: The status role is what makes screen readers announce that something is loading, without moving focus.
    since: 0.1.0
    test: { kind: role, selector: ':scope', oneOf: [status] }
    css: false
    editor: { level: refuse }

  - id: spinner/has-text
    description: The spinner has text, such as "Loading…".
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/non-text-content
    rationale: A rotating graphic alone says nothing to screen-reader users, or to anyone who doesn't read it as loading.
    since: 0.1.0
    test: { kind: nonEmptyText, selector: '{label}' }
    css:
      coverage: partial
      violation: '[data-gui="spinner"] [data-gui-part="label"]:empty'
      pseudo: before
      message: "spinner/has-text: the spinner needs text, such as \"Loading…\"."
    editor: { level: refuse }

  - id: spinner/graphic-hidden
    description: The graphic is hidden from assistive technology.
    level: recommended
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Techniques/aria/ARIA14
    rationale: The text carries the meaning; a graphic read aloud ("image", or nothing useful) adds noise.
    since: 0.1.0
    test: { kind: absent, selector: '{graphic}:not([aria-hidden="true"])' }
    css:
      violation: '[data-gui="spinner"] [data-gui-part="graphic"]:not([aria-hidden="true"])'
      message: "spinner/graphic-hidden: add aria-hidden=true to the graphic."

  - id: spinner/not-focusable
    description: The spinner and its parts can't take focus.
    level: recommended
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/focus-order
    rationale: A loading indicator isn't something to act on; a stray focus stop sends keyboard users nowhere.
    since: 0.1.0
    test: { kind: absent, selector: ':is([tabindex], a[href], button)' }
    css:
      violation: '[data-gui="spinner"]:is([tabindex], :has([tabindex], a[href], button))'
      message: "spinner/not-focusable: remove tabindex and interactive content from the spinner."

  - id: spinner/one-label
    description: There is exactly one text part.
    level: recommended
    type: technique
    source: https://www.w3.org/WAI/WCAG22/Understanding/status-messages
    rationale: One short text is announced once; several parts read as a jumble.
    since: 0.1.0
    test: { kind: count, selector: '{label}', equals: 1 }
    css: false

  - id: spinner/no-live-override
    description: The root has no aria-live next to its role.
    level: recommended
    type: technique
    source: https://www.w3.org/TR/wai-aria-1.2/#status
    rationale: The status role is already polite; an extra aria-live can make some screen readers announce it twice or too urgently.
    since: 0.1.0
    test: { kind: absent, selector: ':scope[aria-live]' }
    css:
      violation: '[data-gui="spinner"][aria-live]'
      message: "spinner/no-live-override: role=status is enough; remove aria-live."

# Where the component can't look the same in every engine (checked by scripts/consistency.mjs), and why.
knownDifferences: []

wcag:
  - { criterion: "1.1.1", name: Non-text Content, level: A, how: "The graphic is hidden; the text says what is happening" }
  - { criterion: "2.3.3", name: Animation from Interactions, level: AAA, how: "Under reduced motion the rotation becomes a slow pulse" }
  - { criterion: "4.1.3", name: Status Messages, level: AA, how: "role=status announces the text without moving focus" }

siteResponsibilities:
  - { criterion: "4.1.3", title: Say when it's done, text: "Replace or remove the spinner when loading finishes, and put the result (or an error) in a status message." }
  - { criterion: "2.2.2", title: Don't spin forever, text: "If loading can take long or fail, show text that says so instead of an endless animation." }
  - { title: Loading needs a script, text: "Showing and hiding the spinner around a request is the site's script; the spinner itself needs none." }

editor:
  help:
    label: 'Say what is loading: "Loading results…" is clearer than "Please wait".'
  softWarnings:
    - { id: SP-W1, text: 'A text that is only "Please wait" or "…"' }

attributes:
  - { on: root, name: data-gui, type: '"spinner"', required: true, description: Marks the element as a Grounded UI spinner. }
  - { on: root, name: role, type: '"status"', required: true, description: Announces the text without moving focus. }
  - { on: root, name: data-gui-variant, type: '"quiet" | "large"', description: 'Quiet hides the text visually; large is a bigger graphic.' }
  - { on: graphic, name: aria-hidden, type: '"true"', required: true, description: Hides the animated graphic from assistive technology. }

customProperties:
  --gui-spinner-size: Graphic size.
  --gui-spinner-large-size: Graphic size in the large variant.
  --gui-spinner-track: Colour of the ring's track.
  --gui-spinner-duration: One rotation.
  --gui-spinner-gap: Space between graphic and text.
