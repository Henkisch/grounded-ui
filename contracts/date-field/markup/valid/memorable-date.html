<fieldset data-gui="date-field" data-gui-variant="memorable">
  <legend data-gui-part="legend">What is your date of birth?</legend>
  <p data-gui-part="description" id="dob-desc">For example, 27 3 2007</p>
  <div data-gui-part="items">
    <div data-gui-part="item">
      <label data-gui-part="label" for="dob-day">Day</label>
      <input data-gui-part="control" type="text" id="dob-day" name="dob-day" size="2" inputmode="numeric" autocomplete="bday-day" aria-describedby="dob-desc">
    </div>
    <div data-gui-part="item">
      <label data-gui-part="label" for="dob-month">Month</label>
      <input data-gui-part="control" type="text" id="dob-month" name="dob-month" size="2" inputmode="numeric" autocomplete="bday-month" aria-describedby="dob-desc">
    </div>
    <div data-gui-part="item">
      <label data-gui-part="label" for="dob-year">Year</label>
      <input data-gui-part="control" type="text" id="dob-year" name="dob-year" size="4" inputmode="numeric" autocomplete="bday-year" aria-describedby="dob-desc">
    </div>
  </div>
</fieldset>
