<!-- Breaks date-field/control-name-includes-label: aria-label "Date" replaces the visible label "Start date". -->
<div data-gui="date-field">
  <label data-gui-part="label" for="start-date">Start date</label>
  <input data-gui-part="control" type="date" id="start-date" name="start-date" aria-label="Date">
</div>
