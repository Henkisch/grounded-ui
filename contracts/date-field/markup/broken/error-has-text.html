<!-- Breaks date-field/error-has-text: the error message is empty. -->
<fieldset data-gui="date-field" data-gui-variant="memorable">
  <legend data-gui-part="legend">When was your passport issued?</legend>
  <p data-gui-part="description" id="issued-desc">For example, 12 11 2021</p>
  <p data-gui-part="error" id="issued-error"></p>
  <div data-gui-part="items">
    <div data-gui-part="item">
      <label data-gui-part="label" for="issued-day">Day</label>
      <input data-gui-part="control" type="text" id="issued-day" name="issued-day" size="2" inputmode="numeric" autocomplete="off" value="12" aria-describedby="issued-desc">
    </div>
    <div data-gui-part="item">
      <label data-gui-part="label" for="issued-month">Month</label>
      <input data-gui-part="control" type="text" id="issued-month" name="issued-month" size="2" inputmode="numeric" autocomplete="off" value="11" aria-describedby="issued-desc">
    </div>
    <div data-gui-part="item">
      <label data-gui-part="label" for="issued-year">Year</label>
      <input data-gui-part="control" type="text" id="issued-year" name="issued-year" size="4" inputmode="numeric" autocomplete="off" aria-invalid="true" aria-describedby="issued-error issued-desc">
    </div>
  </div>
</fieldset>
