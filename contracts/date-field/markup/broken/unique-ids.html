<!-- Breaks date-field/unique-ids: a hidden element repeats the input's id. -->
<div data-gui="date-field">
  <label data-gui-part="label" for="start-date">Start date</label>
  <input data-gui-part="control" type="date" id="start-date" name="start-date">
  <span id="start-date" hidden>Start</span>
</div>
