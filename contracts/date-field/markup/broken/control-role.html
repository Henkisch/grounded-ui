<!-- Breaks date-field/control-role: role="combobox" makes the date input announce a popup list it doesn't have. -->
<div data-gui="date-field">
  <label data-gui-part="label" for="start-date">Start date</label>
  <input data-gui-part="control" type="date" id="start-date" name="start-date" role="combobox">
</div>
