<!-- Breaks date-field/label-tied-to-control: the label has no for; aria-labelledby names the input instead. -->
<div data-gui="date-field">
  <label data-gui-part="label" id="start-date-label">Start date</label>
  <input data-gui-part="control" type="date" id="start-date" name="start-date" aria-labelledby="start-date-label">
</div>
