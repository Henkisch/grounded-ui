<!-- Breaks date-field/native-input: a scripted div role="textbox" instead of an <input>. It is named and has the right role. -->
<div data-gui="date-field">
  <label data-gui-part="label" id="start-date-label" for="start-date">Start date</label>
  <div data-gui-part="control" id="start-date" role="textbox" tabindex="0" aria-labelledby="start-date-label">2026-10-01</div>
</div>
