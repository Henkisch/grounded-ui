<p>You can apply for a parking permit if you are registered at an address in the zone.</p>
<details data-gui="disclosure">
  <summary data-gui-part="summary">What counts as registered?</summary>
  <div data-gui-part="panel">
    <p>Your address in the population register on the day you apply. A temporary address counts if it lasts at least six months.</p>
  </div>
</details>
