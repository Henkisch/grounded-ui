<!-- Breaks choice-group/radio-has-form-name: the radios have no name, so they are not one group. also: choice-group/radios-share-name -->
<fieldset data-gui="choice-group">
  <legend data-gui-part="legend">How should we contact you?</legend>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="o-1">
    <label data-gui-part="label" for="o-1">Email</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="o-2">
    <label data-gui-part="label" for="o-2">Phone</label>
  </div>
</fieldset>
