<!-- Breaks choice-group/error-has-text: the error message is empty. -->
<fieldset data-gui="choice-group" aria-describedby="g-error">
  <legend data-gui-part="legend">How should we contact you?</legend>
  <p data-gui-part="error" id="g-error"></p>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="o-1" name="c-1" aria-invalid="true">
    <label data-gui-part="label" for="o-1">Email</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="o-2" name="c-2" aria-invalid="true">
    <label data-gui-part="label" for="o-2">Phone</label>
  </div>
</fieldset>
