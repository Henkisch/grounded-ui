<!-- Breaks CG-24: the middle radio has another name, so it can be selected together with the others. -->
<fieldset data-gui="choice-group">
  <legend data-gui-part="legend">Bin size</legend>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="bin-140" name="bin" value="140">
    <label data-gui-part="label" for="bin-140">140 litres, every other week</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="bin-190" name="bin-size" value="190" checked>
    <label data-gui-part="label" for="bin-190">190 litres, every other week</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="bin-370" name="bin" value="370">
    <label data-gui-part="label" for="bin-370">370 litres, every week</label>
  </div>
</fieldset>
