<!-- Breaks CG-19: a span role="checkbox" instead of an input. It is named and has the role, so every outcome rule passes. -->
<fieldset data-gui="choice-group">
  <legend data-gui-part="legend">How should we contact you?</legend>
  <div data-gui-part="option">
    <span data-gui-part="control" role="checkbox" aria-checked="false" tabindex="0" aria-labelledby="l-1"></span>
    <label data-gui-part="label" id="l-1" for="o-1">Email</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="o-2" name="c-2">
    <label data-gui-part="label" for="o-2">Phone</label>
  </div>
</fieldset>
