<!-- Breaks choice-group/fieldset-element: a div role="group" instead of a fieldset. It is named and has the role, so every outcome rule passes. -->
<div data-gui="choice-group" role="group" aria-labelledby="g-legend">
  <legend data-gui-part="legend" id="g-legend">How should we contact you?</legend>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="o-1" name="c-1">
    <label data-gui-part="label" for="o-1">Email</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="o-2" name="c-2">
    <label data-gui-part="label" for="o-2">Phone</label>
  </div>
</div>
