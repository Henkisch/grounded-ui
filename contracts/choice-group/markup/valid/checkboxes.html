<fieldset data-gui="choice-group">
  <legend data-gui-part="legend">How should we contact you?</legend>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="contact-email" name="contact-email" value="email" checked>
    <label data-gui-part="label" for="contact-email">Email</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="contact-phone" name="contact-phone" value="phone">
    <label data-gui-part="label" for="contact-phone">Phone</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="contact-letter" name="contact-letter" value="letter">
    <label data-gui-part="label" for="contact-letter">Letter</label>
  </div>
</fieldset>
