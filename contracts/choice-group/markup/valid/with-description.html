<fieldset data-gui="choice-group" aria-describedby="topics-desc">
  <legend data-gui-part="legend">Which newsletters do you want?</legend>
  <p data-gui-part="description" id="topics-desc">Choose as many as you like. You can change this later.</p>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="topics-events" name="topics-events" value="events">
    <label data-gui-part="label" for="topics-events">Events and culture</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="topics-roads" name="topics-roads" value="roads">
    <label data-gui-part="label" for="topics-roads">Roadworks and traffic</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="topics-schools" name="topics-schools" value="schools">
    <label data-gui-part="label" for="topics-schools">Schools and preschools</label>
  </div>
</fieldset>
