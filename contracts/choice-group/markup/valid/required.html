<fieldset data-gui="choice-group">
  <legend data-gui-part="legend">Preferred language <span data-gui-part="required-indicator" aria-hidden="true">*</span></legend>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="lang-sv" name="lang" value="sv" required>
    <label data-gui-part="label" for="lang-sv">Swedish</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="lang-en" name="lang" value="en" required>
    <label data-gui-part="label" for="lang-en">English</label>
  </div>
</fieldset>
