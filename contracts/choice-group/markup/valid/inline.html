<fieldset data-gui="choice-group" data-gui-variant="inline">
  <legend data-gui-part="legend">Do you need an interpreter?</legend>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="interpreter-yes" name="interpreter" value="yes">
    <label data-gui-part="label" for="interpreter-yes">Yes</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="interpreter-no" name="interpreter" value="no">
    <label data-gui-part="label" for="interpreter-no">No</label>
  </div>
</fieldset>
