<fieldset data-gui="choice-group" aria-describedby="consent-error consent-desc">
  <legend data-gui-part="legend">How may we use your answers?</legend>
  <p data-gui-part="description" id="consent-desc">Choose at least one.</p>
  <p data-gui-part="error" id="consent-error"><span aria-hidden="true">⚠</span> Choose at least one way we may use your answers</p>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="consent-stats" name="consent-stats" value="stats" aria-invalid="true">
    <label data-gui-part="label" for="consent-stats">Anonymous statistics</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="checkbox" id="consent-contact" name="consent-contact" value="contact" aria-invalid="true">
    <label data-gui-part="label" for="consent-contact">Contacting me about my case</label>
  </div>
</fieldset>
