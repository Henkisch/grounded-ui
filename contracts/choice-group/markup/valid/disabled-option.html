<fieldset data-gui="choice-group">
  <legend data-gui-part="legend">Collection day</legend>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="day-mon" name="day" value="mon" checked>
    <label data-gui-part="label" for="day-mon">Monday</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="day-wed" name="day" value="wed" disabled>
    <label data-gui-part="label" for="day-wed">Wednesday (fully booked)</label>
  </div>
  <div data-gui-part="option">
    <input data-gui-part="control" type="radio" id="day-fri" name="day" value="fri">
    <label data-gui-part="label" for="day-fri">Friday</label>
  </div>
</fieldset>
