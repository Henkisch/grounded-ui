<!-- Breaks TT-06: the close control is a bare "×" with no name. -->
<span data-component="toggletip">
  <button type="button" data-part="trigger" commandfor="vat-tip" command="toggle-popover" aria-label="About VAT numbers"><span aria-hidden="true">i</span></button>
  <span data-part="content" id="vat-tip" popover>
    Two-letter country code followed by the number.
    <button type="button" data-part="close" commandfor="vat-tip" command="hide-popover"><span aria-hidden="true">×</span></button>
  </span>
</span>
