<!-- Breaks TT-10: show-popover opens the explanation but the trigger can't close it again. -->
<span data-component="toggletip">
  <button type="button" data-part="trigger" commandfor="vat-tip" command="show-popover" aria-label="About VAT numbers"><span aria-hidden="true">i</span></button>
  <span data-part="content" id="vat-tip" popover>Two-letter country code followed by the number.</span>
</span>
