<div data-gui="file-upload">
  <label data-gui-part="label" for="permit">Building permit</label>
  <p data-gui-part="description" id="permit-desc">PDF, max 10 MB.</p>
  <input data-gui-part="control" type="file" id="permit" name="permit" accept=".pdf" aria-invalid="true" aria-describedby="permit-error permit-desc">
  <p data-gui-part="error" id="permit-error"><span aria-hidden="true">⚠</span> The file is 14 MB. Choose a PDF under 10 MB.</p>
</div>
