<div data-gui="file-upload">
  <label data-gui-part="label" for="id-copy">
    Copy of your ID
    <span data-gui-part="required-indicator" aria-hidden="true">*</span>
  </label>
  <p data-gui-part="description" id="id-copy-desc">PDF, JPG or PNG, max 10 MB.</p>
  <input data-gui-part="control" type="file" id="id-copy" name="id-copy" accept=".pdf,.jpg,.jpeg,.png" required aria-describedby="id-copy-desc">
</div>
