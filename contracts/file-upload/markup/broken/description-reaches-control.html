<!-- Breaks file-upload/description-reaches-control: the limits are shown but never reach the control. also: description-in-describedby -->
<div data-gui="file-upload">
  <label data-gui-part="label" for="photo">Photo</label>
  <p data-gui-part="description" id="photo-desc">JPG or PNG, max 10 MB.</p>
  <input data-gui-part="control" type="file" id="photo" name="photo" accept=".jpg,.png">
</div>
