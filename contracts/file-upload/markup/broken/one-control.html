<!-- Breaks file-upload/one-control: two inputs share one label. also: has-name -->
<div data-gui="file-upload">
  <label data-gui-part="label" for="cv">Your CV</label>
  <input data-gui-part="control" type="file" id="cv" name="cv" accept=".pdf">
  <input data-gui-part="control" type="file" id="cv-2" name="cv-2" accept=".pdf">
</div>
