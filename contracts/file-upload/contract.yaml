# Contract: file-upload
# A native file input with a label, a description of accepted files, and an error message.
# The single source for the conformance tests, warning CSS, editor validation and the docs page.
# Test selectors name parts ({label}, {control}, …); `:scope` is the root.
# No role rule: HTML-AAM gives input type=file no corresponding ARIA role (aria-query has no mapping for it),
# and axe-core falls back to "textbox" in every engine. A role rule would encode that fallback, not a standard.
component: file-upload
contractVersion: 0.1.0
title: File upload
summary: A native file input with a label, a description of the accepted files and sizes, and an error message. Zero JavaScript.

budget:
  css: 1536
  js: 0

# Browser features the reference implementation relies on, by web-features id.
requires:
  - feature: scope
  - feature: file-selector-button

anatomy:
  root:
    label: Root
    element: [div]
    required: true
  label:
    label: Label
    element: [label]
    required: true
  description:
    label: Description
    element: [p, div]
  control:
    label: Control
    element: [input]
    required: true
  error:
    label: Error message
    element: [p, div]
    requiredWhen: '[aria-invalid="true"]'
  required-indicator:
    label: Required indicator
    element: [span]

domOrder: [label, description, control, error]

states:
  - { name: required, label: Required, dom: required, hook: ":required" }
  - { name: invalid, label: Invalid, dom: 'aria-invalid="true"', hook: '[aria-invalid="true"]' }
  - { name: disabled, label: Disabled, dom: disabled, hook: ":disabled" }
  - { name: focus, label: Focus, hook: ":focus-visible" }

keyboard:
  - { key: Tab / Shift + Tab, behavior: Moves focus to and from the control }
  - { key: Enter or Space, behavior: Opens the browser's file picker }
  - { key: Click on the label, behavior: Moves focus to the control (in some browsers it opens the picker) }

# level: normative = a standard requires it (source says which); recommended = our judgement, open to review.
# type: outcome = what any implementation must achieve, judged on the rendered result (computed name, role,
#       description, visible text); outside implementations are judged on these.
#       technique = how Grounded UI's reference markup achieves it; always recommended, never a verdict on other markup.
rules:
  - id: file-upload/one-control
    description: There is exactly one control.
    level: recommended
    type: technique
    source: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships
    rationale: One label describes one control; a second input in the field has no label of its own.
    since: 0.1.0
    test: { kind: count, selector: '{control}', equals: 1 }
    css:
      violation: '[data-gui="file-upload"]:not(:has([data-gui-part="control"]))'
      message: "file-upload/one-control: the field has no [data-gui-part=control]."
    editor: { level: warn }

  - id: file-upload/control-element
    description: The control is an input with type="file".
    level: recommended
    type: technique
    source: https://html.spec.whatwg.org/multipage/input.html#file-upload-state-(type=file)
    rationale: The native file input opens the platform's picker, accepts dropped files and works with the keyboard, with no script.
    since: 0.1.0
    test: { kind: absent, selector: '{control}:not(input[type="file"])' }
    css:
      violation: '[data-gui="file-upload"]:has([data-gui-part="control"]:not(input[type="file"]))'
      message: 'file-upload/control-element: the control must be an <input type="file">.'
    editor: { level: refuse }

  - id: file-upload/one-label
    description: There is exactly one label.
    level: recommended
    type: technique
    source: https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions
    rationale: The browser's button text ("Choose File") says nothing about what to upload; one visible label does. file-upload/has-name checks the name itself.
    since: 0.1.0
    test: { kind: count, selector: '{label}', equals: 1 }
    css:
      violation: '[data-gui="file-upload"]:not(:has([data-gui-part="label"]))'
      message: "file-upload/one-label: the field has no [data-gui-part=label]."
    editor: { level: refuse }

  - id: file-upload/label-element
    description: The label is a label element.
    level: recommended
    type: technique
    source: https://www.w3.org/WAI/WCAG22/Techniques/html/H44
    rationale: A native label gives the control its name and survives CSS and JavaScript failures.
    since: 0.1.0
    test: { kind: absent, selector: '{label}:not(label)' }
    css:
      violation: '[data-gui="file-upload"]:has([data-gui-part="label"]:not(label))'
      message: "file-upload/label-element: the label must be a <label>."

  - id: file-upload/label-has-text
    description: The label has non-empty text.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value
    rationale: An empty label leaves the control named only by the browser's button text.
    since: 0.1.0
    test: { kind: nonEmptyText, selector: '{label}' }
    css:
      coverage: partial
      violation: '[data-gui="file-upload"] [data-gui-part="label"]:empty'
      pseudo: before
      message: "file-upload/label-has-text: the label is empty."
    editor: { level: refuse }

  - id: file-upload/label-for-matches-id
    description: The label's for matches the control's id.
    level: recommended
    type: technique
    source: https://www.w3.org/WAI/WCAG22/Techniques/html/H44
    rationale: for/id is the most robust way to associate the label; file-upload/has-name and file-upload/name-includes-label check the resulting name for any technique.
    since: 0.1.0
    test:
      kind: attrEquals
      a: { selector: '{label}', attr: for }
      b: { selector: '{control}', attr: id }
    css: false
    editor: { level: warn }

  - id: file-upload/has-form-name
    description: The control has a name.
    level: recommended
    type: technique
    source: https://html.spec.whatwg.org/multipage/form-control-infrastructure.html#naming-form-controls:-the-name-attribute
    rationale: Without a name the chosen files are never submitted, which fails silently for the user.
    since: 0.1.0
    test: { kind: absent, selector: '{control}:not([name])' }
    css:
      violation: '[data-gui="file-upload"]:has([data-gui-part="control"]:not([name]))'
      message: "file-upload/has-form-name: the control has no name attribute."
    editor: { level: refuse }

  - id: file-upload/has-accept
    description: The control lists the accepted file types in accept.
    level: recommended
    type: technique
    source: https://html.spec.whatwg.org/multipage/input.html#attr-input-accept
    rationale: accept lets the picker show only files that will work, so users don't pick a file that is rejected after the upload.
    since: 0.1.0
    test: { kind: absent, selector: '{control}:not([accept])' }
    css:
      violation: '[data-gui="file-upload"]:has([data-gui-part="control"]:not([accept]))'
      message: "file-upload/has-accept: list the accepted file types in accept."
    editor: { level: warn }

  - id: file-upload/description-in-describedby
    description: If there is a description, its id is referenced in aria-describedby.
    level: recommended
    type: technique
    source: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships
    rationale: An unassociated description is invisible to screen-reader users when the field has focus.
    since: 0.1.0
    test:
      kind: idrefIncludes
      from: { selector: '{control}', attr: aria-describedby }
      to: '{description}'
    css: false

  - id: file-upload/invalid-has-error
    description: If the control has aria-invalid="true", there is an error message in the field or referenced by the control.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/error-identification
    rationale: WCAG 3.3.1 requires the error to be described in text, not only flagged.
    since: 0.1.0
    test: { kind: invalidHasError, control: '{control}', error: '{error}' }
    css:
      violation: '[data-gui="file-upload"]:has([aria-invalid="true"]):not(:has([data-gui-part="error"]))'
      message: "file-upload/invalid-has-error: aria-invalid=true but no [data-gui-part=error]."
    editor: { level: refuse }

  - id: file-upload/error-first-in-describedby
    description: The error's id comes first in aria-describedby.
    level: recommended
    type: technique
    source: https://www.w3.org/TR/wai-aria-1.2/#aria-describedby
    rationale: Screen readers read describedby in id order; the error is the most urgent information.
    since: 0.1.0
    test:
      kind: idrefFirst
      from: { selector: '{control}', attr: aria-describedby }
      to: '{error}'
    css: false

  - id: file-upload/error-has-text
    description: The error message has non-empty text.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/error-identification
    rationale: An empty error part flags the field without saying what is wrong.
    since: 0.1.0
    test: { kind: nonEmptyText, selector: '{error}' }
    css:
      coverage: partial
      violation: '[data-gui="file-upload"] [data-gui-part="error"]:empty'
      pseudo: before
      message: "file-upload/error-has-text: the error message is empty."
    editor: { level: warn }

  - id: file-upload/unique-ids
    description: Ids inside the field are unique on the page.
    level: normative
    type: outcome
    source: https://html.spec.whatwg.org/multipage/dom.html#the-id-attribute
    rationale: A duplicate id makes for and aria-describedby point at the wrong element.
    since: 0.1.0
    test: { kind: uniqueIds }
    css: false
    editor: { level: warn }

  - id: file-upload/no-competing-aria-label
    description: The control has no aria-label competing with the label.
    level: recommended
    type: technique
    source: https://www.w3.org/WAI/WCAG22/Understanding/label-in-name
    rationale: aria-label overrides the visible label as the name; if the texts differ, voice control users can't target the field.
    since: 0.1.0
    test: { kind: absent, selector: ':scope:has({label}):has({control}[aria-label])' }
    css:
      violation: '[data-gui="file-upload"]:has([data-gui-part="label"]):has([data-gui-part="control"][aria-label])'
      message: "file-upload/no-competing-aria-label: the control has both a <label> and an aria-label."

  - id: file-upload/has-name
    description: The control has a non-empty accessible name.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value
    rationale: Without a name the field is announced by the browser's button text alone, which says nothing about what to upload.
    since: 0.1.0
    test: { kind: name, selector: '{control}' }
    css: false

  - id: file-upload/name-includes-label
    description: The control's accessible name contains the visible label text.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/label-in-name
    rationale: Voice-control users say the label they see; if the name differs, they can't reach the field.
    since: 0.1.0
    test: { kind: name, selector: '{control}', includes: '{label}' }
    css: false

  - id: file-upload/description-reaches-control
    description: If there is a description, its text reaches the control's accessible description or name.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions
    rationale: Accepted types and size limits must be announced before the upload, not only in an error afterwards (WCAG 3.3.2).
    since: 0.1.0
    test: { kind: exposes, selector: '{control}', text: '{description}' }
    css: false

  - id: file-upload/error-reaches-control
    description: If there is an error message, its text reaches the control's accessible description or name.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/error-identification
    rationale: An error announced only visually leaves screen-reader users with a rejected file and no reason.
    since: 0.1.0
    test: { kind: exposes, selector: '{control}', text: '{error}' }
    css: false

  - id: file-upload/target-size
    description: The control is at least 24 by 24 CSS pixels.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum
    rationale: The whole input, button included, is the target; small targets are hard to hit with a tremor or on touch screens.
    since: 0.1.0
    test: { kind: targetSize, selector: '{control}', min: 24 }
    css: false

  - id: file-upload/focus-ring-visible
    description: The control shows a focus ring with at least 3:1 contrast against the background when focused by keyboard.
    level: normative
    type: outcome
    source: https://www.w3.org/WAI/WCAG22/Understanding/focus-visible
    rationale: Keyboard users need to see where they are; a ring in the same colour as the page (or none at all) hides it. WCAG 1.4.11 sets the 3:1 floor.
    since: 0.1.0
    test: { kind: focusRing, selector: '{control}', min: 3 }
    css: false

# Where the component can't look the same in every engine (checked by scripts/consistency.mjs), and why.
knownDifferences:
  - part: control
    reason: The file input's button and status texts are the browser's ("Choose File" / "No file chosen" in Chromium, "Browse…" / "No file selected." in Firefox, "no file selected" in Safari) and can't be changed with CSS, so its inner layout differs slightly by engine.

wcag:
  - { criterion: "1.3.1", name: Info and Relationships, level: A, how: "label associated via for; description and error associated via aria-describedby" }
  - { criterion: "2.4.6", name: Headings and Labels, level: AA, how: "A visible label says what to upload; the browser's button text never replaces it" }
  - { criterion: "2.5.3", name: Label in Name, level: A, how: "The visible label text is the field's accessible name" }
  - { criterion: "2.5.8", name: Target Size (Minimum), level: AA, how: "The input, button included, is at least 24 by 24 CSS pixels" }
  - { criterion: "3.3.1", name: Error Identification, level: A, how: "aria-invalid plus an error message associated via aria-describedby" }
  - { criterion: "3.3.2", name: Labels or Instructions, level: A, how: "Accepted types and size limits are in the description, announced with the field" }
  - { criterion: "4.1.2", name: "Name, Role, Value", level: A, how: "Native file input; no ARIA replacing its semantics" }
  - { criterion: "2.4.7", name: Focus Visible, level: AA, how: ":focus-visible with an outline, never removed" }
  - { criterion: "1.4.11", name: Non-text Contrast, level: AA, how: "Drop zone border, button border and focus ring at least 3:1" }

siteResponsibilities:
  - { criterion: "3.3.1", title: Check files on the server, text: "accept only filters the picker. The server must check type and size, and return a clear error when a file is rejected." }
  - { title: Scan uploads, text: "Virus scanning, storage and privacy of uploaded files are the site's job." }
  - { criterion: "3.3.4", title: Let users review, text: "For uploads with legal or financial effect, show what was uploaded and allow it to be removed or replaced before submitting." }
  - { criterion: "2.4.7", title: Don't remove the focus ring, text: "Grounded UI never uses !important, so a site rule like :focus { outline: 0 } removes the field's focus ring." }
  - { title: Drag highlight needs script, text: "There is no CSS selector for a file being dragged over the input. Highlighting the zone during a drag needs JavaScript; the resting style is already a clear drop target." }

editor:
  help:
    label: 'Say what to upload: "Your CV", "Photo of the damage". Not "Choose file".'
    description: 'State the accepted types and the size limit, for example "PDF or JPG, max 10 MB". Users need this before they pick a file.'
    error: 'Say what was wrong and what works instead: "The file is 14 MB. Choose a file under 10 MB."'
  softWarnings:
    - { id: FU-W1, text: 'A label that is only "File", "Upload" or "Choose file"' }
    - { id: FU-W2, text: A description that doesn't mention a file type or size }

attributes:
  - { on: root, name: data-gui, type: '"file-upload"', required: true, description: Marks the element as a Grounded UI file upload. }
  - { on: label, name: for, type: id, required: true, description: The control's id. }
  - { on: control, name: type, type: '"file"', required: true, description: The native file input. }
  - { on: control, name: id, type: string, required: true, description: Target for the label's for. }
  - { on: control, name: name, type: string, required: true, description: The form field name sent on submit. }
  - { on: control, name: accept, type: string, description: 'Accepted types, for example ".pdf,.jpg" or "image/*". Only filters the picker; check on the server too.' }
  - { on: control, name: multiple, type: boolean, description: Allows choosing more than one file. }
  - { on: control, name: aria-describedby, type: id list, description: 'Error id first, then the description id.' }
  - { on: control, name: aria-invalid, type: '"true"', description: Set by the server when a file was rejected. Requires an error part. }
  - { on: control, name: required, type: boolean, description: Marks the field as required for browsers and screen readers. }
  - { on: description, name: id, type: string, description: Referenced from the control's aria-describedby. }
  - { on: error, name: id, type: string, description: Referenced first in the control's aria-describedby. }

customProperties:
  --gui-file-upload-gap: Space between parts.
  --gui-file-upload-label-weight: Label font weight.
  --gui-file-upload-muted: Description and disabled text colour.
  --gui-file-upload-control-bg: Drop zone background.
  --gui-file-upload-border: Drop zone and button border colour (keep it at least 3:1 against the background).
  --gui-file-upload-border-hover: Drop zone border colour on hover.
  --gui-file-upload-radius: Corner radius of the drop zone and the button.
  --gui-file-upload-touch-target: Minimum control height.
  --gui-file-upload-focus: Focus ring colour.
  --gui-file-upload-danger: Error text and border colour.
  --gui-file-upload-duration: Hover transition duration.
