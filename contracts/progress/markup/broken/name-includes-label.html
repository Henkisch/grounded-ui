<!-- Breaks progress/name-includes-label: aria-label "Download" replaces the visible label "Uploading report.pdf". -->
<div data-gui="progress">
  <label data-gui-part="label" for="upload">Uploading report.pdf</label>
  <progress data-gui-part="control" id="upload" max="100" value="64" aria-label="Download">64 %</progress>
</div>
