<!-- Breaks progress/progress-element: a div with ARIA instead of <progress>. It is named and has the role, so every outcome rule passes. -->
<div data-gui="progress">
  <label data-gui-part="label" id="upload-label" for="upload">Uploading report.pdf</label>
  <div data-gui-part="control" id="upload" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-labelledby="upload-label">64 %</div>
</div>
