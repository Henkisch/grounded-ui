<!-- Breaks accordion/summary-exposes-state: a scripted div button with no aria-expanded; users can't hear whether it is open. also: accordion/item-element, accordion/summary-element -->
<div data-gui="accordion">
  <div data-gui-part="item">
    <div data-gui-part="summary" role="button" tabindex="0">Opening hours</div>
    <div data-gui-part="panel"><p>Monday to Friday 8–17.</p></div>
  </div>
</div>
