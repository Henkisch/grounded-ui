<!-- Breaks SL-09: the description is repeated in aria-description instead of being referenced by id. Screen readers still get it. -->
<div data-component="select">
  <label data-part="label" for="city">City</label>
  <p data-part="description" id="city-desc">Where you live today.</p>
  <select data-part="control" id="city" name="city" aria-description="Where you live today.">
    <option value="malmo">Malmö</option>
  </select>
</div>
