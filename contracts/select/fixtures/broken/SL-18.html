<!-- Breaks SL-18: the error is shown but never reaches the control. also: SL-11 -->

  <label data-part="label" for="city">City</label>
  <select data-part="control" id="city" name="city" aria-invalid="true">
    <option value="">Choose a city</option>
  </select>
  <p data-part="error" id="city-error">Choose the city you live in</p>
</div>
