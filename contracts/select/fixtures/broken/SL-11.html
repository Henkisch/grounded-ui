<!-- Breaks SL-11: the description id comes before the error id. -->
<div data-component="select">
  <label data-part="label" for="city">City</label>
  <p data-part="description" id="city-desc">Where you live today.</p>
  <select data-part="control" id="city" name="city" aria-invalid="true" aria-describedby="city-desc city-error">
    <option value="">Choose a city</option>
  </select>
  <p data-part="error" id="city-error">Choose the city you live in</p>
</div>
