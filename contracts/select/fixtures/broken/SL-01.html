<!-- Breaks SL-01: two controls share one label. also: SL-15 -->
<div data-component="select">
  <label data-part="label" for="from">Travel between</label>
  <select data-part="control" id="from" name="from">
    <option value="malmo">Malmö</option>
  </select>
  <select data-part="control" id="to" name="to">
    <option value="lund">Lund</option>
  </select>
</div>
