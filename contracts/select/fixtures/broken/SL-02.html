<!-- Breaks SL-02: a scripted div role="combobox" instead of a native select. It is named and has the right role, so every outcome rule passes. -->
<div data-component="select">
  <label data-part="label" id="city-label" for="city">City</label>
  <div data-part="control" id="city" name="city" role="combobox" aria-labelledby="city-label" aria-expanded="false" tabindex="0">Malmö</div>
</div>
