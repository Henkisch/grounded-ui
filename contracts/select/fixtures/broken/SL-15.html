<!-- Breaks SL-15: the label text is aria-hidden, so the control has no accessible name. -->
<div data-component="select">
  <label data-part="label" for="city"><span aria-hidden="true">City</span></label>
  <select data-part="control" id="city" name="city">
    <option value="malmo">Malmö</option>
  </select>
</div>
