<div data-component="select">
  <label data-part="label" for="country">
    Country
    <span data-part="required-indicator" aria-hidden="true">*</span>
  </label>
  <select data-part="control" id="country" name="country" autocomplete="country" required>
    <option value="">Choose a country</option>
    <option value="dk">Denmark</option>
    <option value="fi">Finland</option>
    <option value="no">Norway</option>
    <option value="se">Sweden</option>
  </select>
</div>
