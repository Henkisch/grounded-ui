<!-- Breaks select/description-reaches-control: the description is shown but never reaches the control. also: select/description-in-describedby -->
<div data-gui="select">
  <label data-gui-part="label" for="city">City</label>
  <p data-gui-part="description" id="city-desc">Where you live today.</p>
  <select data-gui-part="control" id="city" name="city">
    <option value="malmo">Malmö</option>
  </select>
</div>
