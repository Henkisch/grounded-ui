<!-- Breaks select/label-for-matches-id: the label points at a different id than the control has. also: select/has-name -->
<div data-gui="select">
  <label data-gui-part="label" for="town">City</label>
  <select data-gui-part="control" id="city" name="city">
    <option value="malmo">Malmö</option>
  </select>
</div>
