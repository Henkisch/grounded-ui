<!-- Breaks SL-15: the label text is aria-hidden, so the control has no accessible name. -->
<div data-gui="select">
  <label data-gui-part="label" for="city"><span aria-hidden="true">City</span></label>
  <select data-gui-part="control" id="city" name="city">
    <option value="malmo">Malmö</option>
  </select>
</div>
