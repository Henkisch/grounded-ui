<!-- Breaks select/error-reaches-control: the error is shown but never reaches the control. also: select/error-first-in-describedby -->
<div data-gui="select">
  <label data-gui-part="label" for="city">City</label>
  <select data-gui-part="control" id="city" name="city" aria-invalid="true">
    <option value="">Choose a city</option>
  </select>
  <p data-gui-part="error" id="city-error">Choose the city you live in</p>
</div>
