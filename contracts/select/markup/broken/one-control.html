<!-- Breaks select/one-control: two controls share one label. also: select/has-name -->
<div data-gui="select">
  <label data-gui-part="label" for="from">Travel between</label>
  <select data-gui-part="control" id="from" name="from">
    <option value="malmo">Malmö</option>
  </select>
  <select data-gui-part="control" id="to" name="to">
    <option value="lund">Lund</option>
  </select>
</div>
