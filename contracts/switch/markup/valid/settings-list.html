<div style="display: grid; gap: 1em; max-inline-size: 32em;">
  <div data-gui="switch">
    <label data-gui-part="label" for="set-news">News from the municipality</label>
    <input data-gui-part="control" type="checkbox" role="switch" switch id="set-news" name="set-news" checked>
  </div>
  <div data-gui="switch">
    <label data-gui-part="label" for="set-roadworks">Roadworks near me</label>
    <input data-gui-part="control" type="checkbox" role="switch" switch id="set-roadworks" name="set-roadworks" aria-describedby="set-roadworks-desc">
    <p data-gui-part="description" id="set-roadworks-desc">Within two kilometres of your address.</p>
  </div>
  <div data-gui="switch">
    <label data-gui-part="label" for="set-events">Events and culture</label>
    <input data-gui-part="control" type="checkbox" role="switch" switch id="set-events" name="set-events">
  </div>
</div>
