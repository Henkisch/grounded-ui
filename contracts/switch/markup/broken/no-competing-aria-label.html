<!-- Breaks switch/no-competing-aria-label: an aria-label repeats the visible label; harmless today, but the two drift apart. -->
<div data-gui="switch">
  <label data-gui-part="label" for="dark-mode">Dark mode</label>
  <input data-gui-part="control" type="checkbox" role="switch" switch id="dark-mode" name="dark-mode" aria-label="Dark mode">
</div>
