<!-- Breaks switch/focus-ring-visible: the site's theme removes focus outlines. -->
<style>:focus { outline: 0; }</style>
<div data-gui="switch">
  <label data-gui-part="label" for="dark-mode">Dark mode</label>
  <input data-gui-part="control" type="checkbox" role="switch" switch id="dark-mode" name="dark-mode">
</div>
