<!-- Breaks switch/state-exposed: aria-checked="yes" isn't a state assistive technology understands. -->
<div data-gui="switch">
  <label data-gui-part="label" for="dark-mode">Dark mode</label>
  <input data-gui-part="control" type="checkbox" role="switch" switch id="dark-mode" name="dark-mode" aria-checked="yes">
</div>
