<!-- Breaks switch/one-control: two controls share one label, so the second has no name. also: has-name -->
<div data-gui="switch">
  <label data-gui-part="label" for="dark-mode">Dark mode</label>
  <input data-gui-part="control" type="checkbox" role="switch" switch id="dark-mode" name="dark-mode">
  <input data-gui-part="control" type="checkbox" role="switch" switch id="dark-mode-2" name="dark-mode-2">
</div>
