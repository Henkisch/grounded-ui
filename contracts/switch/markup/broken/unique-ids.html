<!-- Breaks switch/unique-ids: another element on the page also has the id dark-mode. -->
<div data-gui="switch">
  <label data-gui-part="label" for="dark-mode">Dark mode</label>
  <input data-gui-part="control" type="checkbox" role="switch" switch id="dark-mode" name="dark-mode">
</div>
<span id="dark-mode" hidden>Theme settings</span>
