<!-- Breaks switch/description-reaches-control: the description is shown but never reaches the switch. also: description-in-describedby -->
<div data-gui="switch">
  <label data-gui-part="label" for="weekly-digest">Weekly digest</label>
  <input data-gui-part="control" type="checkbox" role="switch" switch id="weekly-digest" name="weekly-digest">
  <p data-gui-part="description" id="weekly-digest-desc">One email every Monday with news from your area.</p>
</div>
