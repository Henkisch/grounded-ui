<!-- Breaks switch/switch-attribute: no switch attribute, so Safari doesn't offer its native switch. role="switch" still covers every browser. -->
<div data-gui="switch">
  <label data-gui-part="label" for="dark-mode">Dark mode</label>
  <input data-gui-part="control" type="checkbox" role="switch" id="dark-mode" name="dark-mode">
</div>
