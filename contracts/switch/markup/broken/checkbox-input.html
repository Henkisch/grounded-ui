<!-- Breaks switch/checkbox-input: a scripted div role="switch" instead of a native checkbox. It has a name and a state, so every outcome rule passes. also: switch-attribute -->
<div data-gui="switch">
  <label data-gui-part="label" id="dark-mode-label" for="dark-mode">Dark mode</label>
  <div data-gui-part="control" id="dark-mode" role="switch" aria-checked="false" tabindex="0" aria-labelledby="dark-mode-label"></div>
</div>
