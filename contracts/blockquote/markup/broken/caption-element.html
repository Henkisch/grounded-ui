<!-- Breaks blockquote/caption-element: the attribution is a paragraph named by aria-labelledby instead of a figcaption. -->
<figure data-gui="blockquote" aria-labelledby="quote-by">
  <blockquote data-gui-part="quote">
    <p>The library is the one room in town where nobody asks what you came to buy.</p>
  </blockquote>
  <p data-gui-part="caption" id="quote-by">Anna Berg, head of the city library</p>
</figure>
