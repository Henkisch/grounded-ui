<!-- Breaks blockquote/attribution-outside-quote: the attribution sits inside the quote, so it is read as quoted words. -->
<figure data-gui="blockquote" aria-label="Quote from Anna Berg">
  <blockquote data-gui-part="quote">
    <p>The library is the one room in town where nobody asks what you came to buy.</p>
    <figcaption data-gui-part="caption">Anna Berg, head of the city library</figcaption>
  </blockquote>
</figure>
