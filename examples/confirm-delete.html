<!-- title: Confirm before deleting -->
<!-- description: An alert dialog that stops a destructive action. Focus starts on the safe choice, and clicking outside does nothing. -->
<p>Draft: <strong>Opening hours, summer 2026</strong></p>
<button data-gui="button" type="button" commandfor="confirm-delete" command="show-modal" data-gui-variant="danger">Delete draft</button>

<dialog data-gui="dialog" data-gui-variant="alert" role="alertdialog" id="confirm-delete" aria-labelledby="confirm-delete-title" aria-describedby="confirm-delete-desc">
  <h2 data-gui-part="title" id="confirm-delete-title">Delete "Opening hours, summer 2026"?</h2>
  <p data-gui-part="body" id="confirm-delete-desc">The draft is removed for everyone. This cannot be undone.</p>
  <div data-gui-part="actions">
    <button data-gui="button" type="button" commandfor="confirm-delete" command="close" autofocus data-gui-variant="secondary">Keep draft</button>
    <button data-gui="button" type="button" commandfor="confirm-delete" command="close" data-gui-variant="danger">Delete</button>
  </div>
</dialog>
