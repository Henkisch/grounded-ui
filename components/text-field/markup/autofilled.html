<!-- :autofill kan inte framkallas i statisk HTML. Fältet bär rätt autocomplete så att webbläsaren fyller i det. -->
<div data-component="text-field" data-part="field">
  <label data-part="label" for="fornamn">Förnamn</label>
  <input data-part="control" type="text" id="fornamn" name="fornamn" autocomplete="given-name">
</div>
