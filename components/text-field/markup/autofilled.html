<!-- :autofill can't be triggered in static HTML. The field carries the right autocomplete so the browser fills it in. -->
<div data-component="text-field" data-part="field">
  <label data-part="label" for="given-name">First name</label>
  <input data-part="control" type="text" id="given-name" name="given-name" autocomplete="given-name">
</div>
