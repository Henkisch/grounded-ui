<div data-component="text-field" data-part="field">
  <label data-part="label" for="epost">E-post</label>
  <p data-part="description" id="epost-desc">Vi använder den bara för bekräftelsen.</p>
  <input data-part="control"
         type="email"
         id="epost"
         name="epost"
         autocomplete="email"
         aria-invalid="true"
         aria-describedby="epost-error epost-desc">
  <p data-part="error" id="epost-error">
    <span aria-hidden="true">⚠</span>
    Ange en giltig e-postadress, till exempel namn@exempel.se
  </p>
</div>
