<button type="button" commandfor="cookies" command="show-modal">Cookie settings</button>

<dialog data-component="dialog" id="cookies" aria-labelledby="cookies-title" aria-describedby="cookies-desc">
  <h2 data-part="title" id="cookies-title">Cookie settings</h2>
  <p data-part="body" id="cookies-desc">We use cookies to measure how the site is used. Nothing is shared with third parties.</p>
  <div data-part="actions">
    <button type="button" commandfor="cookies" command="close">Only necessary</button>
    <button type="button" commandfor="cookies" command="close">Accept all</button>
  </div>
</dialog>
