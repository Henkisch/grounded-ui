<style>
  .field { display: grid; gap: 0.375em; max-inline-size: 22em; }
  .field label { font-weight: 600; }
  .field p { margin: 0; font-size: 0.875em; color: color-mix(in oklab, CanvasText 60%, Canvas); }
  .field input {
    inline-size: 100%;
    min-block-size: 2.75em;
    padding: 0.5em 0.75em;
    font: inherit;
    color: inherit;
    background: Canvas;
    border: 1px solid color-mix(in oklab, CanvasText 40%, Canvas);
    border-radius: 0.375em;
    box-sizing: border-box;
  }
  .field input:focus-visible { outline: 2px solid CanvasText; outline-offset: 2px; }
</style>
<div class="field">
  <label for="town">Municipality</label>
  <p id="town-desc">Start typing to see suggestions.</p>
  <input type="text" id="town" name="town" list="towns" autocomplete="off" aria-describedby="town-desc">
  <datalist id="towns">
    <option value="Göteborg"></option>
    <option value="Malmö"></option>
    <option value="Stockholm"></option>
    <option value="Uppsala"></option>
  </datalist>
</div>
