<style>
  .demo { display: grid; place-items: center; min-block-size: 16em; }
  .demo button { font: inherit; padding: 0.5em 1em; border-radius: 0.375em; border: 1px solid color-mix(in oklab, CanvasText 40%, Canvas); background: Canvas; color: CanvasText; cursor: pointer; }
  dialog {
    inline-size: min(100% - 2em, 26em);
    padding: 1.5em;
    color: CanvasText;
    background: Canvas;
    border: 1px solid color-mix(in oklab, CanvasText 14%, Canvas);
    border-radius: 0.75em;
    box-shadow: 0 1.5em 3em -1em oklch(0% 0 0 / 0.25);
    opacity: 0;
    scale: 0.98;
    transition: opacity 120ms ease-in, scale 120ms ease-in, overlay 120ms allow-discrete, display 120ms allow-discrete;
  }
  dialog[open] {
    opacity: 1;
    scale: 1;
    transition-duration: 180ms;
    transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
    @starting-style { opacity: 0; scale: 0.98; }
  }
  dialog::backdrop {
    background: oklch(0% 0 0 / 0.5);
    opacity: 0;
    transition: opacity 180ms, overlay 180ms allow-discrete, display 180ms allow-discrete;
  }
  dialog[open]::backdrop { opacity: 1; @starting-style { opacity: 0; } }
  dialog h2 { margin: 0 0 0.5em; font-size: 1.25em; }
  dialog p { margin: 0; color: color-mix(in oklab, CanvasText 70%, Canvas); }
  dialog .actions { display: flex; justify-content: end; gap: 0.5em; margin-block-start: 1.5em; }
  html:has(dialog:modal) { overflow: hidden; scrollbar-gutter: stable; }
  @media (prefers-reduced-motion: reduce) { dialog, dialog::backdrop { transition-duration: 0s; } }
</style>
<div class="demo">
  <button type="button" commandfor="recipe-dialog" command="show-modal">Open dialog</button>
</div>
<dialog id="recipe-dialog" aria-labelledby="recipe-dialog-title" closedby="any">
  <h2 id="recipe-dialog-title">Subscribe to the newsletter</h2>
  <p>One email a month. Unsubscribe any time.</p>
  <div class="actions">
    <button type="button" commandfor="recipe-dialog" command="close">Close</button>
  </div>
</dialog>
