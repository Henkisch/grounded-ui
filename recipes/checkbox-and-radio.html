<style>
  .demo { display: grid; gap: 1.25em; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 0.5em; }
  legend { font-weight: 600; padding: 0; margin-block-end: 0.25em; }
  label { display: flex; gap: 0.5em; align-items: center; }
  .native { accent-color: CanvasText; inline-size: 1.25em; block-size: 1.25em; font: inherit; margin: 0; }
  .custom {
    appearance: none; font: inherit; inline-size: 1.25em; block-size: 1.25em; margin: 0;
    display: inline-grid; place-content: center; flex: none;
    border: 2px solid color-mix(in oklab, CanvasText 60%, Canvas); border-radius: 0.25em; background: Canvas;
  }
  .custom[type="radio"] { border-radius: 50%; }
  .custom::before {
    content: ""; inline-size: 0.625em; block-size: 0.625em; scale: 0; background: CanvasText;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    transition: scale 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  .custom[type="radio"]::before { clip-path: circle(50%); }
  .custom:checked::before, .custom:indeterminate::before { scale: 1; }
  .custom:indeterminate::before { clip-path: inset(40% 0); }
  .custom:checked { border-color: CanvasText; }
  :is(.custom, .native):focus-visible { outline: 2px solid CanvasText; outline-offset: 2px; }
  .custom:disabled { opacity: 0.5; cursor: not-allowed; }
  @media (prefers-reduced-motion: reduce) { .custom::before { transition: none; } }
  @media (forced-colors: active) { .custom::before { background: CanvasText; } .custom:checked { border-color: Highlight; } }
</style>
<div class="demo">
  <fieldset>
    <legend>accent-color (native)</legend>
    <label><input class="native" type="checkbox" checked> Email me updates</label>
    <label><input class="native" type="radio" name="n" checked> Weekly</label>
    <label><input class="native" type="radio" name="n"> Monthly</label>
  </fieldset>
  <fieldset>
    <legend>appearance: none (custom)</legend>
    <label><input class="custom" type="checkbox" checked> Email me updates</label>
    <label><input class="custom" type="checkbox" disabled> Text me updates (unavailable)</label>
    <label><input class="custom" type="radio" name="c" checked> Weekly</label>
    <label><input class="custom" type="radio" name="c"> Monthly</label>
  </fieldset>
</div>
